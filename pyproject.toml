[project]
name = "ocean-embed"
version = "0.1.0"
description = "OceanEmbed: Differentiable Physics-Informed 3D Ocean Temperature Reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "httpx>=0.27.0",
    "zarr>=2.16.0",
]

[tool.vercel]
entrypoint = "api/index.py"
